# GameNest 2.0: the overlay on the box's own /home/ubuntu/arcade/docker-compose.yml (prod_v2, 2026-11-15).
# Generated by prod_v2/tools/gen_kit.py. It lives in the kit (/home/ubuntu/gamenest-v2/kit/compose/); box_deploy.sh adds
#   COMPOSE_FILE=docker-compose.yml:/home/ubuntu/gamenest-v2/kit/compose/docker-compose.v2.yml
# to /home/ubuntu/arcade/.env, so a plain `docker compose ...` in ~/arcade uses both files. The box's file is never edited:
# caddy, push, feedback and teenpatti stay exactly as they are; the seven v1 game services keep their names (the Caddyfile and
# the gamenestapp.com routes v1 apps use reach them by name) and get the v2 image; nine games and the wallet are new.
# Never here: TEST_HOOKS, the LAN's ports, any secret. Every service's data is a folder of its own under /home/ubuntu/data.
services:
  ludo:
    image: gamenest-v2/ludo:475cfd5b80c0
    build:
      context: /home/ubuntu/gamenest-v2/src/ludo-rooms
      args:
        BASE: gamenest-v2/base:current
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      PUSH_URL: "http://push:3900"
      RANK_DIR: "/data/ratings"
      WALLET_PUBKEYS_FILE: "/etc/gamenest/wallet_pubkeys.json"
      BASE_PATH: "/ludo"
    volumes:
      - /home/ubuntu/data/ludo:/data
      - /home/ubuntu/gamenest-v2/public:/etc/gamenest:ro
    mem_limit: 600m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  snakes:
    image: gamenest-v2/snakes:4b641595f3c5
