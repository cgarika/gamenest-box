      - /home/ubuntu/secrets/gamenest-v2/appstore:/secrets/appstore:ro
      - /home/ubuntu/secrets/gamenest-v2/play:/secrets/play:ro
      - /home/ubuntu/gamenest-v2/public:/pub                # box_deploy.sh writes the PUBLIC key here for the rooms (export_pubkeys.js)
    ports:
      - "127.0.0.1:3920:3920"   # the box itself only (admin summary over SSH); the public reaches it through Caddy at /wallet
    mem_limit: 300m
    oom_score_adj: -500        # if the box ever runs out of memory, a game server goes first, never the wallet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
